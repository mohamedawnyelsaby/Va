name: CI

# Deployments are done by Vercel's own Git integration (push to main =>
# production deploy). This workflow only verifies the code; it used to also
# run `vercel --prod` from here, which duplicated that and failed every time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Type check
        run: npx tsc --noEmit
      
      - name: Run tests
        run: npm run test

      - name: Build
        # Keep the build output and, if it fails, surface its last lines as
        # annotations (the raw job log is awkward to fetch from tooling).
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error title=Build failed::$(tail -n 25 build.log | tr '\n' '|' | sed 's/%/%25/g')"
            exit 1
          }
        env:
          # Build-time only — no real secrets needed for `next build` to
          # succeed, just non-empty values so nothing throws on undefined.
          # Real values live in Vercel's own environment for the actual
          # deploy; this only proves the build compiles.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: 'ci-build-placeholder-not-a-real-secret'
          NEXTAUTH_URL: 'http://localhost:3000'
          ENCRYPTION_KEY: 'ci-build-placeholder-not-a-real-secret'
          PI_API_KEY: 'ci-build-placeholder'
          PI_SECRET_KEY: 'ci-build-placeholder'
          NEXT_PUBLIC_PI_APP_ID: 'ci-build-placeholder'
