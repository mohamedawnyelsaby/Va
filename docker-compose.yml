# Local / self-hosted stack.
# Required in your .env (no insecure defaults any more):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, NEXTAUTH_SECRET
# Postgres and Redis are bound to 127.0.0.1 only — they are not reachable
# from other machines. Apply the database schema with `npx prisma db push`
# from a machine that has the repo (the runtime image has no Prisma CLI).

services:
  postgres:
    image: postgres:15-alpine
    container_name: va-travel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vatravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vatravel}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vatravel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: va-travel-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: va-travel-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vatravel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vatravel}
      - DIRECT_URL=postgresql://${POSTGRES_USER:-vatravel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vatravel}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: va-travel-network
